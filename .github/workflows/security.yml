# Dependency vulnerability scanning across all three ecosystems. Runs on every
# push/PR and weekly (so newly-published advisories surface even without a
# change). Kept separate from ci.yml so the weekly cron does not also boot the
# heavy prod-deploy job.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the audit only reads the repository.
permissions:
  contents: read

jobs:
  audit:
    name: dependency audit (pnpm / cargo / pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- JS/TS: gate on high+ advisories in production dependencies ---
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production deps)
        run: pnpm audit --prod --audit-level high

      # --- Rust collector: fails on any vulnerability (unmaintained = warning) ---
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

      # --- Python SDK: audit the fully-resolved dependency set ---
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          python-version: "3.14"
      - name: pip-audit (all extras)
        working-directory: packages/sdk-py
        run: |
          uv export --frozen --no-emit-project --all-extras > /tmp/py-reqs.txt
          uvx pip-audit -r /tmp/py-reqs.txt

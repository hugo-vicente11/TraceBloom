[package]
name = "tracebloom-collector"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TraceBloom OTLP/HTTP collector: ingests gen_ai spans and writes them to ClickHouse."

[lib]
name = "tracebloom_collector"
path = "src/lib.rs"

[[bin]]
name = "tracebloom-collector"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }

# OTLP decode: pre-generated prost messages (no protoc, no gRPC transport).
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"

# ClickHouse client (RowBinaryWithNamesAndTypes + HTTP). `time` enables the
# DateTime64 <-> OffsetDateTime serde helpers.
clickhouse = { version = "0.15", features = ["time"] }
time = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
